<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Categories - ShopSphere</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .card {
      max-width: 720px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 680px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .helper-text {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="brand-logo-group">
        <div class="brand-logo small-logo" style="background: rgba(168, 85, 247, 0.15); color: #a855f7;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
          </svg>
        </div>
        <span class="nav-brand-name">ShopSphere <span style="font-size: 0.75rem; color: #a855f7; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-left: 4px;">Categories</span></span>
      </div>

      <div class="nav-actions">
        <button type="button" class="nav-btn secondary-btn" onclick="window.location.href='admin_products.html'">
          ← Back to Admin
        </button>
        <button type="button" class="nav-btn secondary-btn" onclick="logout(event)" style="color: var(--danger) !important;">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="card">
      <div class="brand-header">
        <div class="brand-logo" style="background: linear-gradient(135deg, var(--primary), var(--accent));">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M7 7v10m5-10v10m5-10v10M7 17h10" />
          </svg>
        </div>
        <h2>Add Product Category</h2>
        <p class="brand-subtitle">Admin-only endpoint: <span style="font-family: monospace;">POST /admin/categories</span></p>
      </div>

      <p id="result" class="result" aria-live="polite"></p>

      <div class="input-group">
        <label for="name">Category Name</label>
        <input type="text" id="name" placeholder="e.g. Electronics" autocomplete="off" />
        <div class="helper-text">Category names must be unique </div>
      </div>

      <button type="button" id="submitBtn" onclick="createCategory()">
        ➕ Add Category
      </button>

    
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:8080';

    function getToken() { return localStorage.getItem('token'); }

    function authHeaders() {
      const token = getToken();
      return { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
    }

    function setResult(message, type) {
      const el = document.getElementById('result');
      if (!el) return;
      el.className = `result ${type || ''}`;
      el.innerText = message || '';
    }

    function setSubmitting(isSubmitting) {
      const btn = document.getElementById('submitBtn');
      if (!btn) return;
      btn.disabled = isSubmitting;
    }

    function logout(e) {
      if (e) e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    async function createCategory() {
      try {
        const token = getToken();
        if (!token) {
          setResult('Login required.', 'error');
          return;
        }

        const name = (document.getElementById('name').value || '').trim();
        if (!name) {
          setResult('Category name is required.', 'error');
          return;
        }

        setSubmitting(true);
        setResult('', null);

        const res = await fetch(`${API_BASE}/admin/categories`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ name }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setResult(data.message || data.error || 'Failed to add category', 'error');
          return;
        }

        setResult(data.message || 'Category created successfully.', 'success');
        document.getElementById('name').value = '';
      } catch (e) {
        setResult('Network error. Is backend running on http://localhost:8080?', 'error');
      } finally {
        setSubmitting(false);
      }
    }

    // Optional: block non-admins early based on JWT payload
    (function redirectIfNotAdmin() {
      const token = getToken();
      if (!token) return;
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        if (payload && payload.role !== 'admin') window.location.href = 'products.html';
      } catch (_) {}
    })();

    window.createCategory = createCategory;
    window.logout = logout;
  </script>
</body>
</html>
