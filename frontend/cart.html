<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header-row">
        <h2 style="margin: 0;">Your Cart</h2>
        <div class="header-actions">
          <button type="button" class="small" onclick="window.location.href='products.html'">Back to Products</button>
        </div>
      </div>

      <p id="result" class="result" aria-live="polite"></p>

      <div id="cartItems" class="list" aria-live="polite"></div>

      <div class="footer-links">
        <a href="login.html" onclick="logout(event)">Logout</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080';

    function getToken() {
      return localStorage.getItem('token');
    }

    function authHeaders() {
      const token = getToken();
      return {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      };
    }

    function setResult(message, type) {
      const el = document.getElementById('result');
      el.classList.remove('error', 'success');
      if (type) el.classList.add(type);
      el.innerText = message || '';
    }

    function renderEmpty(msg) {
      document.getElementById('cartItems').innerHTML = `<p class="muted">${msg}</p>`;
    }

    async function fetchCart() {
      try {
        const token = getToken();
        if (!token) {
          setResult('Please login first.', 'error');
          renderEmpty('Login required.');
          return;
        }

        setResult('', null);
        document.getElementById('cartItems').innerHTML = '<p class="muted">Loading cart...</p>';

        const res = await fetch(`${API_BASE}/cart`, {
          method: 'GET',
          headers: authHeaders(),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setResult(data.message || data.error || 'Failed to fetch cart', 'error');
          renderEmpty('Could not load cart.');
          return;
        }

        const items = data.items || [];
        if (!Array.isArray(items) || items.length === 0) {
          setResult('Cart is empty.', 'error');
          renderEmpty('Add items from Products page.');
          return;
        }

        const html = items.map(it => {
          const pid = it.product_id ?? it.ProductID;
          const name = it.product_name ?? it.ProductName ?? 'Item';
          const price = it.price ?? it.Price ?? 0;
          const qty = it.quantity ?? it.Quantity ?? 0;
          return `
            <div class="cart-row" data-product-id="${pid}">
              <div>
                <h3 class="item-name">${name}</h3>
                <div class="meta">Price: $${Number(price)}</div>
              </div>
              <div class="qty-controls">
                <button type="button" class="qty-btn" onclick="decreaseQty(${pid})" ${qty <= 1 ? 'disabled' : ''}>-</button>

                <span class="qty">${Number(qty)}</span>
                <button type="button" class="qty-btn" onclick="increaseQty(${pid})">+</button>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('cartItems').innerHTML = html;
        setResult('Cart loaded.', 'success');
      } catch (e) {
        setResult('Network error while loading cart.', 'error');
      }
    }

    // Backend only has add-to-cart; for +/- we call /cart/add with quantity +/-1.
    // Decrease: we re-add with quantity 0 is NOT supported, so we simulate by adding (qty-1) not possible.
    // Therefore: we implement decrease as: increaseQty? No. We must reload after editing.
    // Workaround: call /cart/add with quantity 1 for '+'; for '-' we reload and if backend supports stock check only.
    // NOTE: Current backend has only AddToCart and ViewCart (no remove). So decrease will be done by adding quantity 0 is not valid.
    // We will implement decrease using the same endpoint by adding quantity 0? The backend expects uint quantity, so 0 will likely not change but will still pass bind and stock check.

    async function increaseQty(productId) {
      const token = getToken();
      if (!token) {
        setResult('Please login first.', 'error');
        return;
      }

      const res = await fetch(`${API_BASE}/cart/add`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ product_id: Number(productId), quantity: 1 }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        setResult(data.message || data.error || 'Failed to increase quantity', 'error');
        return;
      }

      setResult(data.message || 'Quantity increased', 'success');
      await fetchCart();
    }

    async function decreaseQty(productId) {
      // Backend currently only supports AddToCart (POST /cart/add) and ViewCart (GET /cart).
      // There is no dedicated decrement/remove endpoint, so we cannot reliably decrease quantity.
      setResult('Decrease quantity is not supported yet (backend missing decrement/remove).', 'error');
    }


function logout(e) {
      if (e) e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }


    window.increaseQty = increaseQty;
    window.decreaseQty = decreaseQty;
    window.logout = logout;


    // If seller tries to open user cart page, redirect to seller UI.
    (function redirectIfSeller() {
      const token = getToken();
      if (!token) return;
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        const role = payload && payload.role;
        if (role === 'seller') {
          window.location.href = 'seller_products.html';
        }
      } catch (e) {
        // ignore
      }
    })();

    fetchCart();
  </script>
</body>
</html>
