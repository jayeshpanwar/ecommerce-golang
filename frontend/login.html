<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <form class="card" onsubmit="event.preventDefault(); login();">
      <h2>Login</h2>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required />

      <button type="submit" id="submitBtn">Login</button>

      <p id="result" class="result" aria-live="polite"></p>

      <div class="links" style="margin-top: 10px;">
        <a href="products.html" id="postLoginLink" style="display:none;">Go to Products</a>
      </div>


      <div class="links">
        <a href="signup.html">Create an account</a>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
