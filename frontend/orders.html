<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Orders - ShopSphere</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Page Specific Structural Overrides --- */
    .table-responsive-wrapper {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    .orders-table th {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--card-border);
    }

    .orders-table td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      vertical-align: middle;
    }

    .orders-table tr:last-child td {
      border-bottom: none;
    }

    .orders-table tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }

    /* Status Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: capitalize;
    }
    
    .status-pending { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
    .status-completed { background: rgba(16, 185, 129, 0.12); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-cancelled { background: rgba(244, 63, 94, 0.12); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.2); }
    .status-default { background: rgba(255, 255, 255, 0.06); color: var(--muted); border: 1px solid var(--card-border); }

    .item-meta-row {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .order-id-txt {
      font-family: monospace;
      font-weight: 600;
      color: var(--primary);
    }
    .order-total-txt {
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="brand-logo-group">
        <div class="brand-logo small-logo">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </div>
        <span class="nav-brand-name">ShopSphere</span>
      </div>
      <div class="nav-actions">
        <button type="button" class="nav-btn secondary-btn" onclick="window.location.href='products.html'">
          ← Back to Store
        </button>
        <button type="button" class="nav-btn secondary-btn" onclick="logout(event)" style="color: var(--danger) !important;">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <main class="storefront-container">
    <div class="storefront-header">
      <h2>Your Purchase History</h2>
    </div>

    <p id="result" class="result" aria-live="polite"></p>

    <div class="table-responsive-wrapper">
      <div style="overflow-x: auto;">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Placed Date</th>
              <th>Status</th>
              <th>Total Amount</th>
              <th>Items Ordered</th>
            </tr>
          </thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080';

    function getToken() { return localStorage.getItem('token'); }
    function authHeaders() {
      const token = getToken();
      return { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
    }

    function setResult(message, type) {
      const el = document.getElementById('result');
      if (!el) return;
      el.className = `result ${type || ''}`;
      el.innerText = message || '';
    }

    function renderEmpty(msg) {
      document.getElementById('ordersTbody').innerHTML = `
        <tr><td colspan="5" class="muted" style="text-align:center; padding: 40px; font-style: italic;">${msg}</td></tr>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function logout(e) {
      if (e) e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html'; // Points directly to login.html
    }

    function stopIfDetailsRowClick(e) {
      // Prevent the details row from re-triggering the summary row click.
      e.stopPropagation();
    }


    function formatDate(dt) {
      try {
        const d = new Date(dt);
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, {hour: '2-digit', minute:'2-digit'});
      } catch (_) {
        return String(dt ?? '');
      }
    }

    function getStatusBadgeClass(status) {
      const normalized = String(status ?? '').toLowerCase();
      if (normalized.includes('pending') || normalized.includes('process')) return 'status-pending';
      if (normalized.includes('complete') || normalized.includes('deliver') || normalized.includes('paid') || normalized.includes('accepted')) return 'status-completed';
      if (normalized.includes('cancel') || normalized.includes('fail') || normalized.includes('reject') || normalized.includes('rejected')) return 'status-cancelled';
      return 'status-default';
    }


    function clearAuthAndRedirectToLogin() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    async function fetchOrders() {
      const token = getToken();
      if (!token) {
        // If token is missing, redirect to login.
        window.location.href = 'login.html';
        return;
      }


      try {
        setResult('', null);
        document.getElementById('ordersTbody').innerHTML = `
          <tr><td colspan="5" class="muted" style="text-align:center; padding: 40px;"><div class="spinner" style="margin: 0 auto 10px;"></div>Loading orders...</td></tr>
        `;

        const res = await fetch(`${API_BASE}/orders`, { method: 'GET', headers: authHeaders() });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          if (res.status === 401) {
            clearAuthAndRedirectToLogin();
            return;
          }
          setResult(data.message || data.error || 'Failed to fetch orders', 'error');
          renderEmpty('Could not load orders.');
          return;
        }

        const orders = data.data || [];
        if (!orders || !Array.isArray(orders) || orders.length === 0) {
          renderEmpty('You have no orders recorded yet.');
          return;
        }

        const rows = orders.map((o, idx) => {
          const orderId = o.order_id ?? o.OrderID ?? '';
          const orderedAt = o.ordered_at ?? o.OrderedAt ?? '';
          const rawStatus = o.status ?? o.Status ?? o.order_status ?? o.OrderStatus ?? 'Pending';
          const total = Number(o.total_amount ?? o.TotalAmount ?? o.price ?? 0).toFixed(2);
          const items = Array.isArray(o.items) ? o.items : [];

          // Item-by-item status (from backend: items[].status)
          const itemsDetailsHtml = items.length
            ? items.map((it) => {
                const name = escapeHtml(it.product_name ?? it.ProductName ?? '');
                const qty = Number(it.quantity ?? it.Quantity ?? 0);
                const itemStatus = it.status ?? it.Status ?? 'pending';
                const statusClass = getStatusBadgeClass(itemStatus);
                return `
                  <div class="item-meta-row" style="display:flex; align-items:center; justify-content:space-between; gap: 12px;">
                    <div>
                      <div style="font-weight:700; color:#fff;">${name}</div>
                      <div class="muted" style="font-size:0.85rem; color:#94a3b8; margin-top:3px;">Qty: ${qty}</div>
                    </div>
                    <span class="status-badge ${statusClass}">${escapeHtml(itemStatus)}</span>
                  </div>
                `;
              }).join('')
            : '<span class="muted">No item breakdown found</span>';

          const rowKey = `order_${orderId || idx}`;

          return `
            <tr class="order-summary-row" data-order-key="${escapeHtml(rowKey)}" style="cursor:pointer;">
              <td><span class="order-id-txt">#${escapeHtml(orderId)}</span></td>
              <td>${escapeHtml(formatDate(orderedAt))}</td>
              <td><span class="status-badge ${getStatusBadgeClass(rawStatus)}">${escapeHtml(rawStatus)}</span></td>
              <td><span class="order-total-txt">$${escapeHtml(total)}</span></td>
              <td>
                <span class="muted">Click to view item statuses</span>
              </td>
            </tr>
            <tr class="order-details-row" data-order-details="${escapeHtml(rowKey)}" style="display:none;" onclick="stopIfDetailsRowClick(event)">
              <td colspan="5">
                <div class="item-meta-row" style="color:#e2e8f0; padding: 12px 0;">
                  ${itemsDetailsHtml}
                </div>
              </td>
            </tr>

          `;
        }).join('');

        const tbody = document.getElementById('ordersTbody');
        tbody.innerHTML = rows;

        // Bind expand/collapse click handlers (row-level details)
        document.querySelectorAll('.order-summary-row').forEach((row) => {
          row.addEventListener('click', () => {
            const key = row.getAttribute('data-order-key');
            document.querySelectorAll('.order-details-row').forEach((d) => {
              const dk = d.getAttribute('data-order-details');
              if (dk === key) {
                d.style.display = d.style.display === 'none' ? '' : 'none';
              }
            });
          });
        });

      } catch (e) {
        console.error(e);
        setResult('Network error while loading orders.', 'error');
        renderEmpty('Network error.');
      }
    }

    // Fixed safeguard redirect logic
    (function redirectIfSeller() {
      const token = getToken();
      if (!token) return;
      try {
        const base64Url = token.split('.')[1];
        if (!base64Url) return;
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(atob(base64));
        const userRole = payload.role ?? payload.Role ?? 'customer';
        if (userRole === 'seller') { 
          window.location.href = 'seller_products.html'; 
        }
      } catch (e) {
        console.error("Token structure verification bypassed:", e);
      }
    })();

    fetchOrders();
    window.fetchOrders = fetchOrders;
    window.logout = logout;
  </script>
</body>
</html>
