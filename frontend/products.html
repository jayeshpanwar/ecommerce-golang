<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace - ShopSphere</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Overriding Styles to Fix Card Awkwardness --- */
    .marketplace-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 20px 0;
    }

    .custom-product-card {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .custom-product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary, #6366f1);
    }

    .custom-visual-pane {
      height: 220px;
      width: 100%;
      position: relative;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .custom-product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .custom-fallback-box {
      width: 48px;
      height: 48px;
      opacity: 0.2;
      color: #fff;
    }

    .custom-details-pane {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .custom-product-title {
      margin: 0 0 8px 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-pricing-row {
      margin-bottom: 20px;
    }

    .custom-price-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary, #a78bfa);
    }

    .custom-actions-wrapper {
      margin-top: auto;
      width: 100%;
    }

    .custom-submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary, #6366f1);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .custom-submit-btn:hover:not(:disabled) {
      background: #4f46e5;
    }

    .custom-submit-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.3);
      cursor: not-allowed;
    }

    .custom-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-danger {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="brand-logo-group">
        <div class="brand-logo small-logo">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </div>
        <span class="nav-brand-name">ShopSphere</span>
      </div>

      <div class="nav-actions">
        <button type="button" class="nav-btn secondary-btn" onclick="window.location.href='orders.html'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="nav-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.03 0 1.9.793 1.993 1.821m-9.3 15.39c-1.118-.094-1.964-1.057-1.964-2.192V6.108c0-1.135.846-2.098 1.964-2.192m11.123 18V21a3 3 0 0 0-3-3H9.75a3 3 0 0 0-3 3v.75m11.25 0v-4.66a2.25 2.25 0 0 0-.659-1.591L15 14.25M9.75 21v-4.66a2.25 2.25 0 0 1 .659-1.591L12 14.25" /></svg>
          <span>My Orders</span>
        </button>
        
        <button type="button" class="nav-btn primary-btn" onclick="window.location.href='cart.html'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="nav-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" /></svg>
          <span>Go to Cart</span>
        </button>
      </div>
    </nav>

    <main class="storefront-container">
      <div class="storefront-header">
        <div>
          <h2>Trending Catalog</h2>
          <p class="brand-subtitle">Explore top-tier verified items active on the network.</p>
        </div>
        <div class="logout-wrapper">
          <a href="login.html" onclick="logout(event)" class="logout-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px; height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" /></svg>
            <span>Logout</span>
          </a>
        </div>
      </div>

      <p id="result" class="result" aria-live="polite"></p>

      <div id="productsList" class="marketplace-grid" aria-live="polite"></div>
    </main>

  <script src="app.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080';

    function getToken() { return localStorage.getItem('token'); }
    function authHeaders() {
      const token = getToken();
      return { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
    }

    function setResult(message, type) {
      const el = document.getElementById('result');
      if (!el) return;
      el.classList.remove('error', 'success');
      if (type) el.classList.add(type);
      el.innerText = message || '';
    }

    function setLoading(isLoading) {
      const list = document.getElementById('productsList');
      if (isLoading) {
        list.innerHTML = `
          <div class="loading-skeleton-wrapper" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
            <div class="spinner" style="margin: 0 auto 12px;"></div>
            <p class="muted">Querying active catalog items...</p>
          </div>
        `;
      }
    }

    function clearAuthAndRedirectToLogin() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    async function fetchProducts() {
      try {
        setResult('', null);
        const token = getToken();
        if (!token) {
          setResult('Please login first.', 'error');
          window.location.href = 'login.html';
          return;
        }

        setLoading(true);

        const res = await fetch(`${API_BASE}/products`, { method: 'GET', headers: authHeaders() });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          if (res.status === 401) { clearAuthAndRedirectToLogin(); return; }
          setResult(data.message || data.error || 'Failed to fetch products', 'error');
          return;
        }

        const products = data.data || data || [];
        const normalized = (Array.isArray(products) ? products : []).map(p => ({
          id: p.id ?? p.ID,
          name: p.name ?? p.Name,
          price: p.price ?? p.Price,
          stock: p.stock ?? p.Stock,
          imageUrl: p.image_url ?? p.imageUrl ?? p.ImageURL ?? '',
        }));

        if (normalized.length === 0) {
          setResult('Products fetched, but list is empty.', 'error');
          document.getElementById('productsList').innerHTML = '<p class="muted" style="grid-column: 1 / -1; text-align: center;">No products available currently.</p>';
          return;
        }

        const html = normalized.map(p => {
          const id = p.id;
          const name = p.name;
          const price = p.price;
          const stock = p.stock;
          const isOutOfStock = stock !== undefined && Number(stock) <= 0;

          // Uses custom encapsulated class namespaces to completely prevent old layout rules leaking in
          return `
            <div class="custom-product-card">
              <div class="custom-visual-pane">
                ${p.imageUrl ? 
                  `<img class="custom-product-image" src="${p.imageUrl}" alt="${name ?? 'Product image'}" loading="lazy" onerror="this.parentElement.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke-width=\'1.2\' stroke=\'currentColor\' class=\'custom-fallback-box\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' d=\'M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l12 5.25m0 0v-9\' /></svg>'" />` :
                  `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" class="custom-fallback-box">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l12 5.25m0 0v-9" />
                  </svg>`
                }
                <span class="custom-badge ${isOutOfStock ? 'badge-danger' : 'badge-success'}">
                  ${isOutOfStock ? 'Sold Out' : `${stock} units left`}
                </span>
              </div>
              <div class="custom-details-pane">
                <h3 class="custom-product-title" title="${name}">${name ?? 'Premium Merchandise'}</h3>
                <div class="custom-pricing-row">
                  <span class="custom-price-val">$${Number(price ?? 0).toFixed(2)}</span>
                </div>
                <div class="custom-actions-wrapper">
                  <button type="button" class="custom-submit-btn" onclick="addToCart(${id})" ${isOutOfStock ? 'disabled' : ''}>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" style="width:16px; height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    <span>${isOutOfStock ? 'Out of Stock' : 'Add to Cart'}</span>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('productsList').innerHTML = html;
      } catch (e) {
        console.error(e);
        setResult('Network error while fetching products.', 'error');
      }
    }

    async function addToCart(productId) {
      const token = getToken();
      if (!token) { setResult('Please login first.', 'error'); window.location.href = 'login.html'; return; }

      const res = await fetch(`${API_BASE}/cart/add`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ product_id: Number(productId), quantity: 1 }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        if (res.status === 401) { clearAuthAndRedirectToLogin(); return; }
        setResult(data.message || data.error || 'Failed to add to cart', 'error');
        return;
      }

      setResult(data.message || 'Added item to cart successfully!', 'success');
    }

    function logout(e) {
      if (e) e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    (function redirectIfSeller() {
      const token = getToken();
      if (!token) return;
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        if (payload && payload.role === 'seller') { window.location.href = 'seller_products.html'; }
      } catch (e) {}
    })();

    fetchProducts();
    window.addToCart = addToCart;
    window.logout = logout;
  </script>
</body>
</html>
