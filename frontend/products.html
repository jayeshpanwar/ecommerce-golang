<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header-row">
        <h2 style="margin: 0;">Products</h2>
        <div class="header-actions">
          <button type="button" class="small" onclick="window.location.href='cart.html'">Go to Cart</button>


        </div>
      </div>

      <p id="result" class="result" aria-live="polite"></p>

      <div id="productsList" class="grid" aria-live="polite"></div>

      <div class="footer-links">
        <a href="login.html" onclick="logout(event)">Logout</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080';

    function getToken() {
      return localStorage.getItem('token');
    }

    function authHeaders() {
      const token = getToken();
      return {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      };
    }

    function setResult(message, type) {
      const el = document.getElementById('result');
      el.classList.remove('error', 'success');
      if (type) el.classList.add(type);
      el.innerText = message || '';
    }

    function setLoading(isLoading) {
      const list = document.getElementById('productsList');
      if (isLoading) {
        list.innerHTML = '<p class="muted">Loading products...</p>';
      }
    }

    async function fetchProducts() {
      try {
        setResult('', null);
        const token = getToken();
        if (!token) {
          setResult('Please login first.', 'error');
          return;
        }

        setLoading(true);

        const res = await fetch(`${API_BASE}/products`, {
          method: 'GET',
          headers: authHeaders(),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setResult(data.message || data.error || 'Failed to fetch products', 'error');
          return;
        }

        const products = data.data || data || [];
        // Backend returns products with capitalized fields; normalize.
        const normalized = (Array.isArray(products) ? products : []).map(p => ({
          id: p.id ?? p.ID,
          name: p.name ?? p.Name,
          price: p.price ?? p.Price,
          stock: p.stock ?? p.Stock,
        }));

        if (!Array.isArray(normalized) || normalized.length === 0) {
          setResult('Products fetched, but list is empty.', 'error');
          document.getElementById('productsList').innerHTML = '<p class="muted">No products available.</p>';
          return;
        }

        setResult(`Products loaded: ${normalized.length}`, 'success');

        const html = normalized.map(p => {
          const id = p.id;
          const name = p.name;
          const price = p.price;
          const stock = p.stock;


          return `
            <div class="product-card">
              <h3>${name ?? 'Product'}</h3>
              <p class="meta">Price: <b>$${Number(price ?? 0)}</b></p>
              <p class="meta">Stock: <b>${Number(stock ?? 0)}</b></p>
              <div class="actions">
                <button type="button" onclick="addToCart(${id})" ${stock && Number(stock) <= 0 ? 'disabled' : ''}>Add to Cart</button>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('productsList').innerHTML = html;
        setResult('Products loaded.', 'success');
      } catch (e) {
        console.error(e);
        setResult('Network error while fetching products. Open console for details.', 'error');
      }

    }

    async function addToCart(productId) {
      const token = getToken();
      if (!token) {
        setResult('Please login first.', 'error');
        return;
      }

      const res = await fetch(`${API_BASE}/cart/add`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ product_id: Number(productId), quantity: 1 }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        setResult(data.message || data.error || 'Failed to add to cart', 'error');
        return;
      }

      setResult(data.message || 'Added to cart', 'success');
      // Optional: keep user on products page
    }

function logout(e) {
      if (e) e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }


    // If seller tries to open user products page, redirect to seller UI.
    (function redirectIfSeller() {
      const token = getToken();
      if (!token) return;
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        const role = payload && payload.role;
        if (role === 'seller') {
          window.location.href = 'seller_products.html';
        }
      } catch (e) {
        // ignore
      }
    })();

    fetchProducts();

    // expose for inline handlers
    window.addToCart = addToCart;
    window.logout = logout;
  </script>
</body>
</html>
