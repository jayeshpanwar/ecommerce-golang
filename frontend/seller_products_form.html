<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller - Add/Edit/Delete Product</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header-row">
        <h2 style="margin: 0;">Manage Product</h2>
        <div class="header-actions">
          <button type="button" class="small" onclick="window.location.href='seller_products.html'">Back</button>
        </div>
      </div>

      <p id="result" class="result" aria-live="polite"></p>

      <form class="list" onsubmit="event.preventDefault(); createProduct();">
        <h3 style="margin-top:0;">Add Product</h3>

        <label for="name">Name</label>
        <input type="text" id="name" required />

        <label for="price">Price</label>
        <input type="number" id="price" min="0" step="0.01" required />

        <label for="stock">Stock</label>
        <input type="number" id="stock" min="0" step="1" required />

        <label for="description">Description</label>
        <textarea id="description" rows="3"></textarea>

        <button type="submit" id="submitBtn">Add Product</button>
      </form>

      <hr />

      <form class="list" onsubmit="event.preventDefault(); updateProduct();">
        <h3 style="margin-top:0;">Edit Product</h3>

        <label for="editId">Product ID</label>
        <input type="number" id="editId" min="1" required />

        <label for="editName">New Name</label>
        <input type="text" id="editName" placeholder="(optional)" />

        <label for="editPrice">New Price</label>
        <input type="number" id="editPrice" min="0" step="0.01" placeholder="(optional)" />

        <label for="editStock">New Stock</label>
        <input type="number" id="editStock" min="0" step="1" placeholder="(optional)" />

        <label for="editDescription">New Description</label>
        <textarea id="editDescription" rows="3" placeholder="(optional)"></textarea>

        <button type="submit" id="submitBtn2">Update Product</button>
      </form>

      <hr />

      <form class="list" onsubmit="event.preventDefault(); deleteProduct();">
        <h3 style="margin-top:0;">Delete Product</h3>

        <label for="deleteId">Product ID</label>
        <input type="number" id="deleteId" min="1" required />

        <button type="submit" class="danger" id="submitBtn3">Delete Product</button>
      </form>

      <div class="footer-links">
        <a href="seller_products.html">View My Products</a>
        <a href="login.html" onclick="logout(event)">Logout</a>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const API_BASE = 'http://localhost:8080';

    function getToken() {
      return localStorage.getItem('token');
    }

    function authHeaders() {
      const token = getToken();
      return {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      };
    }

    function setResult(message, type) {
      const el = document.getElementById('result');
      el.classList.remove('error', 'success');
      if (type) el.classList.add(type);
      el.innerText = message || '';
    }

    function logout(e) {
      if (e) e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    async function createProduct() {
      try {
        const token = getToken();
        if (!token) {
          setResult('Please login first.', 'error');
          return;
        }

        const payload = {
          name: document.getElementById('name').value.trim(),
          price: Number(document.getElementById('price').value),
          stock: Number(document.getElementById('stock').value),
          description: document.getElementById('description').value.trim(),
        };

        const res = await fetch(`${API_BASE}/seller/products`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(payload),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setResult(data.message || data.error || 'Failed to add product', 'error');
          return;
        }

        setResult(data.message || 'Product added successfully', 'success');
      } catch {
        setResult('Network error. Is the backend running on http://localhost:8080?', 'error');
      }
    }

    async function updateProduct() {
      try {
        const token = getToken();
        if (!token) {
          setResult('Please login first.', 'error');
          return;
        }

        const id = Number(document.getElementById('editId').value);
        const input = {};

        const name = document.getElementById('editName').value.trim();
        const priceRaw = document.getElementById('editPrice').value;
        const stockRaw = document.getElementById('editStock').value;
        const desc = document.getElementById('editDescription').value.trim();

        if (name) input.name = name;
        if (priceRaw !== '') input.price = Number(priceRaw);
        if (stockRaw !== '') input.stock = Number(stockRaw);
        if (desc) input.description = desc;

        const res = await fetch(`${API_BASE}/seller/products/${id}`, {
          method: 'PUT',
          headers: authHeaders(),
          body: JSON.stringify(input),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setResult(data.message || data.error || 'Failed to update product', 'error');
          return;
        }

        setResult(data.message || 'Product updated successfully', 'success');
      } catch {
        setResult('Network error. Is the backend running on http://localhost:8080?', 'error');
      }
    }

    async function deleteProduct() {
      try {
        const token = getToken();
        if (!token) {
          setResult('Please login first.', 'error');
          return;
        }

        const id = Number(document.getElementById('deleteId').value);

        const res = await fetch(`${API_BASE}/seller/products/${id}`, {
          method: 'DELETE',
          headers: authHeaders(),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setResult(data.message || data.error || 'Failed to delete product', 'error');
          return;
        }

        setResult(data.message || 'Product deleted successfully', 'success');
      } catch {
        setResult('Network error. Is the backend running on http://localhost:8080?', 'error');
      }
    }

    window.createProduct = createProduct;
    window.updateProduct = updateProduct;
    window.deleteProduct = deleteProduct;
    window.logout = logout;
  </script>
</body>
</html>
