<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <form class="card" onsubmit="event.preventDefault(); signup();">
      <h2>Signup</h2>

      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" autocomplete="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="new-password" required />

      <label for="role">Role</label>
      <select id="role" required>
        <option value="user" selected>User</option>
        <option value="seller">Seller</option>
      </select>

      <button type="submit" id="submitBtn">Create account</button>

      <p id="result" class="result" aria-live="polite"></p>

      <div class="links">
        <a href="login.html">Already have an account? Login</a>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
